<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IIT — Sistema RRHH</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-page">

<div class="login-wrap">
  <div class="login-card">

    <div class="login-logo">
      <div class="logo-icon">IIT</div>
      <div class="logo-text">
        <span class="logo-main">InfraestructuraIT</span>
        <span class="logo-sub">Sistema de Recursos Humanos</span>
      </div>
    </div>

    <div id="login-error" class="alert alert-error" style="display:none"></div>

    <form id="login-form" autocomplete="off">
      <div class="field-group">
        <label class="field-label">Cédula o correo</label>
        <input type="text" id="login-user" class="field-input" placeholder="12345678 o usuario@iit.com.co" autofocus>
      </div>
      <div class="field-group">
        <label class="field-label">Contraseña</label>
        <div class="input-wrap">
          <input type="password" id="login-pass" class="field-input" placeholder="Tu contraseña">
          <button type="button" class="input-toggle" onclick="togglePass()">👁</button>
        </div>
      </div>
      <button type="submit" class="btn-primary btn-full" id="login-btn">
        Ingresar al sistema
      </button>
    </form>

    <div class="login-footer">
      <a href="#" onclick="showRecovery()">¿Olvidaste tu contraseña?</a>
      <span>·</span>
      <span>v1.0 · IIT 2026</span>
    </div>

  </div>
</div>

<script src="js/auth.js"></script>
<script>
  document.getElementById('login-form').onsubmit = function(e) {
    e.preventDefault();
    Auth.login(
      document.getElementById('login-user').value,
      document.getElementById('login-pass').value
    );
  };
  function togglePass() {
    var p = document.getElementById('login-pass');
    p.type = p.type === 'password' ? 'text' : 'password';
  }
  function showRecovery() {
    alert('Contacta al administrador del sistema: rrhh@iit.com.co');
  }
</script>
</body>
</html>
